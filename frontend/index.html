<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Special Proposal 💖</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap');
:root{--p-soft-pink:#ffdbe6;--p-peach:#ffeedd;--p-mint:#dff7ec;--p-lavender:#f6e6ff;--p-sky:#e6f7ff;--accent:#ff9bb3}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter, Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;}

body{
  height:100vh;
  background: linear-gradient(160deg,var(--p-lavender),var(--p-soft-pink),var(--p-sky));
  background-size: 300% 300%;
  animation: bgShift 18s ease-in-out infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:#3b2b2b;
  text-align:center;
  -webkit-font-smoothing:antialiased;
}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.container{animation:containerEnter .8s cubic-bezier(.2,.9,.2,1);}
@keyframes containerEnter{0%{opacity:0;transform:translateY(18px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}

/* Floating Hearts */
.heart{position:absolute;font-size:22px;will-change:transform,opacity;pointer-events:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,0.45));}
@keyframes float{0%{transform:translateY(110vh) scale(.8);opacity:0}10%{opacity:1}100%{transform:translateY(-15vh) scale(1);opacity:0}}

.container{
  background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  padding:34px;
  border-radius:22px;
  backdrop-filter: blur(8px) saturate(120%);
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 10px 40px rgba(155,89,255,0.12), inset 0 -6px 24px rgba(0,0,0,0.2);
  width:92%;
  max-width:640px;
  position:relative;
  z-index:2;
} 

input{
padding:10px;
border-radius:20px;
border:none;
margin:10px;
width:80%;
text-align:center;
}

button{
padding:10px 20px;
border:none;
border-radius:25px;
margin:10px;
cursor:pointer;
font-size:16px;
transition:.3s;
}

/* legacy .yes removed — enhanced styles are defined below */

.no{background:linear-gradient(90deg,#c3ecff,#ffd6e6);color:#2b2b2b;position:absolute;border-radius:30px;padding:10px 18px;box-shadow:0 8px 30px rgba(0,0,0,0.18)}

#countdown{margin-top:14px;font-size:18px;color:#ffe6f0}

/* helper keyframes for gradients */
@keyframes btnShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* Fireworks Canvas */
canvas{position:fixed;top:0;left:0;pointer-events:none;mix-blend-mode:screen}

/* Celebration overlay & confetti */
.celebrate-overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  backdrop-filter: blur(6px);
  background:
    radial-gradient(circle at 30% 20%, rgba(255,20,100,0.12), transparent 20%),
    linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.45));
  pointer-events:auto;
}
.celebrate-card{
  padding:28px 36px;
  border-radius:18px;
  text-align:center;
  background:linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}
.blast-name{
  font-family:'Great Vibes', cursive;
  font-size:clamp(36px,9vw,96px);
  font-weight:700;
  line-height:1;
  margin:0;
  background:linear-gradient(90deg,var(--p-soft-pink),var(--p-lavender),var(--p-peach));
  background-size:300% 300%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 8px 30px rgba(255,150,185,0.12);
  transform-origin:center;
  animation:gradText 6s linear infinite, nameBlast .9s cubic-bezier(.2,.9,.2,1) both;
}
.blast-name::after{content:'';position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,0.15),rgba(255,255,255,0));mix-blend-mode:overlay;opacity:.6;transform:translateX(-100%);animation:shine 1s ease .25s forwards}
@keyframes shine{to{transform:translateX(100%)}}
.char{display:inline-block;opacity:0;transform:translateY(10px) rotate(-3deg);animation:revealChar .45s forwards cubic-bezier(.2,.9,.2,1)}
@keyframes revealChar{to{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes gradText{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes nameBlast{0%{transform:scale(.2) rotate(-6deg);opacity:0;filter:blur(4px)}60%{transform:scale(1.04) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.blast-msg{
  margin-top:10px;
  font-size:clamp(14px,3vw,22px);
  color:#ffd6e6;
  animation:msgPop .6s ease-out;
}
@keyframes msgPop{0%{transform:translateY(8px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.confetti-piece{position:absolute;width:10px;height:14px;border-radius:2px;opacity:.95;transform-origin:center;will-change:transform,opacity;animation:confettiFall var(--dur) linear forwards;}
@keyframes confettiFall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* Large decorative background heart */
.bg-heart{position:fixed;left:50%;top:35%;transform:translate(-50%,-50%) scale(.98);width:min(70vmin,820px);height:auto;opacity:0;z-index:0;pointer-events:none;filter:blur(6px) drop-shadow(0 30px 60px rgba(255,150,185,0.06));transition:opacity .6s cubic-bezier(.2,.9,.2,1),transform .6s;will-change:transform,opacity}
.bg-heart.visible{opacity:.12;transform:translate(-50%,-50%) scale(1)}
.bg-heart.pulse{animation:bgHeartPulse 1.2s ease-in-out 1;opacity:.22}
@keyframes bgHeartPulse{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1)}}

/* long stretched heart (emoji-based for consistent shape) */
.long-heart{
  font-size:clamp(36px,10vw,140px);
  display:block;
  margin:12px auto 0;
  transform:scaleX(2.2) rotate(-6deg);
  filter:drop-shadow(0 10px 30px rgba(255,20,120,0.25));
  opacity:0; 
  transition: transform .45s cubic-bezier(.2,.9,.2,1), opacity .45s ease;
}
.long-heart.pulse{animation:heartPulse 1.1s ease-in-out infinite alternate;opacity:1}
@keyframes heartPulse{0%{transform:scaleX(2.2) scaleY(1)}100%{transform:scaleX(2.4) scaleY(1.06)}}

.share-btn{background:#ff4d88;color:white;border:none;padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:700;box-shadow:0 6px 18px rgba(255,20,120,0.18);} 

/* Header row + audio */
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.main-title{font-weight:800;letter-spacing:0.6px}
.audio-toggle{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:6px 8px;border-radius:10px;color:#ffd6e6;cursor:pointer;backdrop-filter:blur(4px);transition:transform .18s}
.audio-toggle:hover{transform:scale(1.06)}
.audio-toggle.pulse-small{transform:scale(1.08)}

/* subtitle */
.subtitle{color:#ffb7d8;margin:8px 0 18px;font-size:14px;opacity:.95;transition:opacity .25s}

/* live preview */
.live-preview{margin:8px auto 14px;display:inline-flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));box-shadow:inset 0 -6px 18px rgba(0,0,0,0.25);opacity:.95;transition:opacity .25s}
.preview-heart{font-size:28px;transform:scaleX(1.9);display:inline-block;transition:transform .35s,opacity .35s}
.preview-heart.pulse{animation:heartPulse .9s ease-in-out infinite alternate}
#previewName{font-family:'Great Vibes', cursive; font-size:20px;color:#ffd6e6;text-shadow:0 6px 16px rgba(255,20,120,0.08)}
#previewName.show{filter:drop-shadow(0 8px 30px rgba(52, 33, 42, 0.08));}

/* Yes button — richer */
.yes{position:relative;overflow:hidden;background:linear-gradient(90deg,var(--p-soft-pink),var(--p-peach));padding:12px 28px;font-size:18px;border-radius:999px;box-shadow:0 12px 30px rgba(255,155,183,0.18);border:0;color:#361828;font-weight:800;transition:transform .22s,box-shadow .22s}
.yes:hover{box-shadow:0 20px 50px rgba(255,155,183,0.18);transform:translateY(-4px) scale(1.02)}
.yes:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 18px 40px rgba(255,20,120,0.22)}
.yes:active{transform:scale(.98)}
.yes .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.35);transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:rippleAnim .6s forwards}
@keyframes rippleAnim{to{transform:translate(-50%,-50%) scale(18);opacity:0}}

/* small helper */
.pulse-small{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

</style> 
</head>

<body>

<audio autoplay loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<canvas id="fireworks"></canvas>

<div class="bg-heart" aria-hidden="true">
  <svg viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="bgHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffd1dc" stop-opacity="1"/>
        <stop offset="50%" stop-color="#ffb7d1" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#ffe6f0" stop-opacity="0.9"/>
      </linearGradient>
    </defs>
    <path fill="url(#bgHeartGrad)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4 4 6.5 4 8 4 9.5 4.9 10.7 6.4 11.9 4.9 13.4 4 15 4 17.5 4 19.5 6 19.5 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </svg>
</div>

<div class="container">
  <div class="header-row">
    <h1 class="main-title">💍 Special Question 💖</h1>
    <button id="audioToggle" class="audio-toggle" title="Toggle music">🔊</button>
  </div>
  <p class="subtitle">A tiny question with a big heart</p>

  <input type="text" id="girlName" placeholder="Enter Her Beautiful Name ❤️" maxlength="40" autocomplete="off">
  <div id="livePreview" class="live-preview" aria-hidden="true"><span class="preview-heart">💖</span><span id="previewName">Your Love</span></div>

  <p>Will you be my Valentine? 🌹</p>

  <button class="yes" onclick="sayYes()">Yes 💕</button>
<button class="no" id="noBtn" onmouseover="moveButton()" onclick="sayNo()">No 😢</button>

<div id="countdown"></div>
<div id="stats" style="margin-top:8px;color:#ffc0dd;">People who said YES: <span id="yesCount">0</span></div>
</div>

<script>

/* Floating Hearts */
function createHeart(){
  const emojis = ['�','💖','💝','💕','💞'];
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
  heart.style.left = Math.random()*100 + 'vw';
  heart.style.fontSize = (Math.random()*38 + 16) + 'px';
  heart.style.opacity = (0.6 + Math.random()*0.35).toFixed(2);
  heart.style.animationDuration = (3 + Math.random()*4) + 's';
  heart.style.transform = `translateY(0) rotate(${(Math.random()*20-10)}deg)`;
  heart.style.filter = 'drop-shadow(0 8px 28px rgba(0,0,0,0.18))';
  document.body.appendChild(heart);
  setTimeout(()=> heart.remove(), 8000);
}
// softer, more romantic cadence
setInterval(createHeart,320);

/* Countdown Timer */
let valentineDate=new Date("Feb 14, 2026 00:00:00").getTime();
let timer=setInterval(function(){
let now=new Date().getTime();
let distance=valentineDate-now;
let days=Math.floor(distance/(1000*60*60*24));
document.getElementById("countdown").innerHTML="⏳ "+days+" days until Valentine's Day 💖";
},1000);

/* No Button Escape */
function moveButton(){
let btn=document.getElementById("noBtn");
btn.style.left=Math.random()*(window.innerWidth-100)+"px";
btn.style.top=Math.random()*(window.innerHeight-50)+"px";
}

/* Fireworks */
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let particles = [];
function createFirework(x, y){
  const colors = ['#FFD1DC','#FFE9B5','#CFE9FF','#F6D6FF','#D8F3DC','#FFE6F2','#FDEFEF','#FBEFF7'];
  for (let i = 0; i < 120; i++) {
    particles.push({
      x: x,
      y: y,
      speed: Math.random()*6 + 2,
      angle: Math.random()*2*Math.PI,
      radius: 1 + Math.random()*3,
      color: colors[Math.floor(Math.random()*colors.length)],
      life: 50 + Math.floor(Math.random()*60)
    });
  }
}

function animateFireworks(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += Math.cos(p.angle) * p.speed;
    p.y += Math.sin(p.angle) * p.speed;
    p.speed *= 0.96;
    p.radius *= 0.995;
    p.life--;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.2, p.radius), 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life / 100);
    ctx.fill();
    ctx.globalAlpha = 1;
    if (p.life <= 0 || p.radius < 0.25) particles.splice(i, 1);
  }
  requestAnimationFrame(animateFireworks);
}
animateFireworks();

/* Yes Click */
async function sayYes(){
  const name = (document.getElementById("girlName").value || "My Love").trim();

  // multiple small fireworks for drama
  for (let i = 0; i < 3; i++) {
    createFirework(window.innerWidth/2 + (Math.random()*300-150), window.innerHeight/2 + (Math.random()*200-100));
  }

  // send to backend (best-effort, don't block the UX)
  try {
    const res = await fetch('/api/answers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, answer: 'yes' })
    });
    if (res.ok) {
      const data = await res.json();
      if (data.stats && typeof data.stats.yes !== 'undefined') {
        document.getElementById('yesCount').textContent = data.stats.yes;
      } else {
        getStats();
      }
    }
  } catch (err) {
    console.warn('Could not save response to backend:', err);
  }

  // create a full-screen celebration overlay (confetti + big name)
  const overlay = document.createElement('div');
  overlay.className = 'celebrate-overlay';
  overlay.innerHTML = `
    <div class="confetti"></div>
    <div class="celebrate-card">
      <h2 class="blast-name"></h2>
      <p class="blast-msg">You made me the happiest person alive 💕</p>
      <div style="margin-top:18px;">
        <button class="share-btn" id="shareBtn">📲 Share</button>
        <button id="closeCelebrate" style="margin-left:12px;padding:8px 14px;border-radius:18px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:#fff;cursor:pointer;">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  // set name text safely (handwritten reveal)
  const nameEl = overlay.querySelector('.blast-name');
  const chars = (name + '!').split('');
  nameEl.innerHTML = chars.map((c,i)=>`<span class="char" style="animation-delay:${i*40}ms">${c}</span>`).join('');

  // insert a stretched 'long heart' below the name
  const card = overlay.querySelector('.celebrate-card');
  const longHeartEl = document.createElement('div');
  longHeartEl.className = 'long-heart';
  longHeartEl.textContent = '💖';
  card.insertBefore(longHeartEl, card.querySelector('.blast-msg'));

  // small scale/pop animation already handled by CSS keyframes, ensure immediate reflow
  requestAnimationFrame(() => {
    nameEl.style.transform = 'scale(1)';
    // reveal & pulse the long heart
    longHeartEl.style.opacity = '1';
    longHeartEl.classList.add('pulse');
  });

  // confetti burst
  const confettiContainer = overlay.querySelector('.confetti');
  const colors = ['#ffd1dc','#ffe9b5','#cfe9ff','#f6d6ff','#d8f3dc','#fff1f6'];
  for (let i = 0; i < 36; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.setProperty('--dur', (1.4 + Math.random() * 1.4) + 's');
    piece.style.top = (Math.random() * 40 - 10) + 'vh';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    piece.style.opacity = 0.98;
    confettiContainer.appendChild(piece);
    setTimeout(() => piece.remove(), 2600 + Math.random() * 900);
  }

  // extra firework pulses
  for (let i = 0; i < 6; i++) {
    setTimeout(() => createFirework(window.innerWidth/2 + (Math.random()*400-200), window.innerHeight/2 + (Math.random()*300-150)), i * 120);
  }

  // pulse background heart for emphasis
  const bgHeart = document.querySelector('.bg-heart');
  if (bgHeart) {
    bgHeart.classList.add('pulse');
    setTimeout(() => bgHeart.classList.remove('pulse'), 2400);
  }

  // button actions
  overlay.querySelector('#shareBtn').addEventListener('click', () => shareWhatsApp(name));
  overlay.querySelector('#closeCelebrate').addEventListener('click', () => overlay.remove());

  // auto-dismiss after 7s
  setTimeout(() => overlay.remove(), 7000);
}

/* Record No (if clicked) */
async function sayNo(){
  const name = document.getElementById("girlName").value || "Anonymous";
  try {
    await fetch('/api/answers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, answer: 'no' })
    });
    getStats();
  } catch (err) {
    console.warn('Could not save "no" response', err);
  }
}

/* Fetch stats from backend and update UI */
async function getStats(){
  try {
    const res = await fetch('/api/stats');
    if (!res.ok) throw new Error('network');
    const json = await res.json();
    document.getElementById('yesCount').textContent = json.yes || 0;
  } catch (e) {
    console.warn('Could not load stats', e);
  }
}
getStats();

// --- UI enhancements: live preview, audio toggle, button ripple, rotating subtitle ---
(function uiEnhancements(){
  const nameInput = document.getElementById('girlName');
  const previewName = document.getElementById('previewName');
  const livePreview = document.getElementById('livePreview');

  if (nameInput && previewName && livePreview) {
    const bgHeartEl = document.querySelector('.bg-heart');
    nameInput.addEventListener('input', (e) => {
      const v = e.target.value.trim();
      previewName.textContent = v || 'Your Love';
      if (v) {
        previewName.classList.add('show');
        document.querySelector('.preview-heart')?.classList.add('pulse');
        bgHeartEl?.classList.add('visible');
      } else {
        previewName.classList.remove('show');
        document.querySelector('.preview-heart')?.classList.remove('pulse');
        bgHeartEl?.classList.remove('visible');
      }
    });
    nameInput.addEventListener('focus', ()=> {
      livePreview.style.opacity = '1';
      bgHeartEl?.classList.add('visible');
    });
    nameInput.addEventListener('blur', ()=> setTimeout(()=> {
      livePreview.style.opacity = '.9';
      if (!nameInput.value.trim()) bgHeartEl?.classList.remove('visible');
    }, 200));
  }

  // audio toggle
  const audioBtn = document.getElementById('audioToggle');
  const audioEl = document.querySelector('audio');
  if (audioBtn && audioEl) {
    audioBtn.addEventListener('click', ()=>{
      audioEl.muted = !audioEl.muted;
      audioBtn.textContent = audioEl.muted ? '🔇' : '🔊';
      audioBtn.classList.add('pulse-small');
      setTimeout(()=> audioBtn.classList.remove('pulse-small'), 350);
    });
  }

  // yes button ripple
  document.querySelectorAll('.yes').forEach(btn => {
    btn.addEventListener('click', function(e){
      const r = document.createElement('span');
      r.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      r.style.left = (e.clientX - rect.left) + 'px';
      r.style.top = (e.clientY - rect.top) + 'px';
      btn.appendChild(r);
      setTimeout(()=> r.remove(), 700);
    });
  });

  // rotating subtitle phrases
  const subEl = document.querySelector('.subtitle');
  if (subEl) {
    const phrases = ['A tiny question with a big heart','Will you make me the happiest person?','Say Yes and change my world 💖'];
    let i = 0;
    setInterval(()=>{
      subEl.style.opacity = '0';
      setTimeout(()=>{
        subEl.textContent = phrases[i = (i+1) % phrases.length];
        subEl.style.opacity = '1';
      }, 450);
    }, 3500);
  }
})();

/* WhatsApp Share */
function shareWhatsApp(name){
let message="She said YES! 💖 "+name+" is my Valentine! 💕";
let url="https://wa.me/?text="+encodeURIComponent(message);
window.open(url,"_blank");
}

</script>

</body>
</html>
